<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIDGE - Phygital Gateway</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/universal-provider@2.10.2/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/modal@2.6.2/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>BRIDGE</h1>

    <div class="container">
        <div class="box">
            <h2>1. Secure Web3 Identity</h2>
            <p style="color: #9a9aa0; margin-bottom: 25px; font-size: 1.1rem;">Waiting for card scan to authenticate...</p>
            <div id="connectStatus" style="padding: 18px; background: #1a1a1f; border-radius: 8px; text-align: center; color: #9a9aa0; font-size: 1.2rem;">
                <span class="status-indicator status-pending"></span>
                Ready for Card Scan
            </div>
            
            <p id="walletAddress" style="margin-top: 25px; color: #c988a8; word-wrap: break-word; font-family: monospace; font-size: 1.2rem; text-align: center;"></p>
            
            <div style="text-align: center;">
                <button id="disconnectBtn" style="display: none; background: transparent; border: 1px solid #c99a9a; color: #c99a9a; padding: 10px 20px; border-radius: 6px; margin-top: 20px; cursor: pointer; font-size: 1rem; transition: 0.3s;">
                    Disconnect & Reset
                </button>
            </div>
            
            <div id="qrCodeContainer">
                <h3>Scan with Mobile Wallet</h3>
                <div id="qrcode"></div>
                <p>Use MetaMask, Trust Wallet, or any WalletConnect app</p>
            </div>
        </div>

        <div class="box">
            <h2>2. Phygital Ticket Status</h2>
            <div id="ticketVisual" class="ticket-visual level-none">
                <div class="ticket-text center">
                    <h3>Awaiting Scan...</h3>
                    <div class="uid">TAP CARD ON GATE</div>
                </div>
            </div>
            <div id="statsInfo" class="stats-text">
                <span style="color:#9a9aa0">Status:</span> <span style="color:white">Waiting for hardware sync...</span>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <button id="mintBtn" class="connect-btn" style="display: none;">
                    Mint Phygital NFT
                </button>
                <div id="txHash" style="margin-top: 20px; padding: 15px; background: #1a1a1f; border: 1px solid #a8c9a8; border-radius: 8px; display: none;">
                    <p style="color: #a8c9a8; margin: 0; font-weight: bold; font-size: 1.1rem;">NFT Successfully Minted</p>
                    <p id="fakeHashText" style="color: #c988a8; margin: 8px 0 0 0; font-family: monospace; font-size: 1rem; word-wrap: break-word;"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
